name: Live-site smoke test

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-smoke
  cancel-in-progress: true

jobs:
  production:
    name: Production accessibility + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run read-only production smoke tests
        env:
          LIVE_BASE_URL: https://data.africamultiple.uni-bayreuth.de
        run: npm run test:live

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-smoke-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7
