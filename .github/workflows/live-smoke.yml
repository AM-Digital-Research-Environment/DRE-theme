name: Live-site smoke test

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-smoke
  cancel-in-progress: true

jobs:
  production:
    name: Production accessibility + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Advisory only: CI and the release package are tested against the Omeka
      # S release pinned as OMEKA_S_VERSION in ci.yml/release.yml. This says
      # when upstream has moved on, so the pin (and its SHA-256) get updated
      # deliberately rather than discovered from a failing install.
      - name: Omeka S release check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(sed -n 's/^  OMEKA_S_VERSION: *//p' .github/workflows/ci.yml)"
          packaged="$(sed -n 's/^  OMEKA_S_VERSION: *//p' .github/workflows/release.yml)"
          if [ "$pinned" != "$packaged" ]; then
            echo "::warning::OMEKA_S_VERSION differs: ci.yml tests $pinned, release.yml packages against $packaged."
          fi
          latest="$(gh api repos/omeka/omeka-s/releases/latest --jq .tag_name)"
          latest="${latest#v}"
          newest="$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)"
          if [ "$latest" != "$pinned" ] && [ "$newest" = "$latest" ]; then
            echo "::warning::Omeka S $latest is available; CI and release packaging still test $pinned. Update OMEKA_S_VERSION and OMEKA_S_SHA256 in ci.yml and release.yml (and omeka_version_constraint if the range changes)."
          else
            echo "Omeka S $pinned is the latest release."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run read-only production smoke tests
        env:
          LIVE_BASE_URL: https://data.africamultiple.uni-bayreuth.de
        run: npm run test:live

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-smoke-failure-${{ github.run_id }}
          path: test-results/live/
          retention-days: 7

  # Lighthouse over the same smoke surfaces (tests/browser/surfaces.mjs), median
  # of three runs. Thresholds are warn-first (scripts/lib/lighthouse-report.mjs):
  # only accessibility and SEO fail the job; performance, layout shift and the
  # other metrics annotate, since performance swings between runs on a shared
  # runner and CLS waits on DRE Search 1.32.1 being deployed. The job summary
  # groups findings and transferred JS/CSS under each surface owner.
  lighthouse:
    name: Lighthouse (${{ matrix.form-factor }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        form-factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Audit the production smoke surfaces
        env:
          LIVE_BASE_URL: https://data.africamultiple.uni-bayreuth.de
        run: npm run audit:lighthouse -- --form-factor=${{ matrix.form-factor }}

      - name: Keep the median reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-${{ matrix.form-factor }}-${{ github.run_id }}
          path: test-results/lighthouse/
          retention-days: 14
