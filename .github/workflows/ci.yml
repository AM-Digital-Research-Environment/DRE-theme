name: CI

# The theme is developed on a machine with no PHP binary, so `npm run lint:php`
# SKIPS locally when it cannot find one. This workflow is where that asymmetry is
# paid for: PHP is always present here, so the check runs with `--require` and a
# syntax error or a broken metadata grouping cannot reach a release.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css-and-contracts:
    name: CSS build + design contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # lint:tokens (incl. computed WCAG contrast), lint:ini, lint:templates,
      # lint:groups, lint:php — then the Sass build.
      - name: Build
        run: npm run build

      - name: Translations are up to date
        run: npm run i18n:check

      - name: Browser-script unit tests
        run: npm run test:unit

      - name: Dependency audit
        run: npm audit --audit-level=high

      # A stale asset/css/style.css is a real failure mode: the compiled CSS is
      # committed, so a Sass change that was never rebuilt ships the old styles.
      - name: Compiled CSS matches the Sass sources
        run: |
          if ! git diff --quiet -- asset/css/style.css; then
            echo "::error::asset/css/style.css is out of date — run 'npm run build' and commit the result."
            git diff --stat -- asset/css/style.css
            exit 1
          fi

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range, because local development happens at
        # ONE version and the theme is published for any of them:
        #   8.1 — the floor. theme.ini allows Omeka S ^4.2.0, and 4.2.0 runs on
        #         PHP 8.1+, so a GPL theme installed from GitHub can land on an
        #         8.1 host. 8.2+ syntax parses happily on a newer local PHP and
        #         fatals there.
        #   8.5 — the ceiling, and what the Cluster's own instance runs (Omeka S
        #         4.2.1 supports up to 8.5). Catches the deprecations that would
        #         actually show up in production.
        # 8.3 covers the middle.
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # --require turns the local "skip if no PHP" into a hard gate. Runs
      # `php -l` over every .php/.phtml under view/, helper/ and tests/, then
      # executes the theme's PHP tests.
      - name: PHP syntax + behaviour
        run: npm run lint:php:require

  omeka-compatibility:
    name: Omeka S 4.2.1 + PHP 8.5
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_mysql, xml

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Download official Omeka S release
        run: |
          mkdir -p "$RUNNER_TEMP/omeka"
          curl -fsSL "https://github.com/omeka/omeka-s/releases/download/v4.2.1/omeka-s-4.2.1.zip" -o "$RUNNER_TEMP/omeka.zip"
          unzip -q "$RUNNER_TEMP/omeka.zip" -d "$RUNNER_TEMP/omeka"
          OMEKA_ROOT="$(find "$RUNNER_TEMP/omeka" -maxdepth 2 -name bootstrap.php -printf '%h\n' -quit)"
          test -n "$OMEKA_ROOT"
          echo "OMEKA_ROOT=$OMEKA_ROOT" >> "$GITHUB_ENV"

      - name: Install theme into Omeka
        run: |
          mkdir -p "$OMEKA_ROOT/themes/dre"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$OMEKA_ROOT/themes/dre/"

      - name: Discover theme through Omeka's theme manager
        env:
          OMEKA_PATH: ${{ env.OMEKA_ROOT }}
          OMEKA_REPORT_DEPRECATED: '1'
        run: php -d error_reporting=E_ALL -d display_errors=1 tests/OmekaCompatibilityTest.php
